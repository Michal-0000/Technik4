<div class="container">
  <div class="card">
    <div class="card-header text-white bg-primary mb-3">
      <h5 class="card-title">Formularz rejestracyjny</h5>
    </div>    
    <div class="card-body">
      <form>
        <div class="row">
            <div class="col">
                <label for="imie">Imię</label>
            <input type="text" id="imie" class="form-control" placeholder="np. Anna">
            </div>
            <div class="col">
                <label for="nazwisko">Nazwisko</label>
            <input type="text" id="nazwisko" class="form-control" placeholder="np. Kowalska">
            </div>
        </div>
        <div class="row">
            <div class="col">
                <label for="pesel">PESEL</label>
                <input type="text" id="pesel" class="form-control" placeholder="11 cyfr">
            </div>
            <div class="col">
                <label for="dataUrodzenia">Data urodzenia</label>
                <input type="date" id="dataUrodzenia" class="form-control">
            </div>
            <div class="col">
                <label for="wiek">Wiek</label>
                <input type="number" id="wiek" class="form-control" placeholder="lata">
            </div>
        </div>
    </form>
  </div>
</div>
