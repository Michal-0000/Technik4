<div class="container">
<div class="card gap-2">
    <div class="card-body">
        <h5 class="card-title">Wybierz języki programowania:</h5>
        <div class="form-check">
            <input class="form-check-input" id="java" class="form" type="checkbox" [(ngModel)]="java">
            <label class="form-check-label" for="java">Java</label>
            <input class="form-check-input" id="python" class="form" type="checkbox" [(ngModel)]="python">
            <label class="form-check-label" for="python">Python</label>
            <input class="form-check-input" id="cpp" class="form" type="checkbox" [(ngModel)]="cpp">
            <label class="form-check-label" for="cpp">C++</label>
            <input class="form-check-input" id="angular" class="form" type="checkbox" [(ngModel)]="angular">
            <label class="form-check-label" for="angular">Angular</label>
        </div>
    </div>
</div>
</div>
